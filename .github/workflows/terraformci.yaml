name: Terraform Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli